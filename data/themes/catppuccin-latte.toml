# Latte accents are below 4.5:1 as text on its light background;
# only foreground, white and red pass, so the other text roles fall back to the text color.
[roles]
text-muted = "white"
link = "@text"
success = "@text"
warning = "@text"
cursor = "@text"
syntax-keyword = "@text"
syntax-string = "@text"
syntax-number = "@text"
syntax-function = "@text"
