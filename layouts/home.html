{{ define "main" }}
<h1>{{ site.Title }}</h1>
<div class="grid">
  {{- range site.Sections }}
  {{- $id := printf "panel-%s" .Section }}
  <section class="panel" box-="square" aria-labelledby="{{ $id }}">
    <h2 class="panel__title" id="{{ $id }}"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <ul>
      {{- range first 5 .Pages }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
      {{- end }}
    </ul>
  </section>
  {{- end }}
</div>
{{ end }}
