<link rel="canonical" href="{{ .Permalink }}">
{{- range .AllTranslations }}
<link rel="alternate" hreflang="{{ .Language.Locale }}" href="{{ .Permalink }}">
{{- end }}
{{- with site.Home.OutputFormats.Get "rss" }}
<link rel="alternate" type="application/rss+xml" title="{{ site.Params.author }}" href="{{ .Permalink }}">
{{- end }}
{{- if eq .Kind "term" }}{{ with .OutputFormats.Get "rss" }}
<link rel="alternate" type="application/rss+xml" title="{{ humanize $.Data.Term }}" href="{{ .Permalink }}">
{{- end }}{{ end }}
