# Install the hooks once with `deno task hooks`. Formatting and the commit message are checked here; CI runs the rest.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,css,json,svelte}"
      run: biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    - name: taplo
      glob: "*.toml"
      run: taplo fmt --check {staged_files} && taplo lint {staged_files}

commit-msg:
  jobs:
    - name: commit message
      run: deno run --allow-read tools/cli/check-commit-message.ts {1}
