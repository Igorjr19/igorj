# Install the hooks once with `deno task hooks`.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,css,json}"
      run: biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    - name: secrets
      run: gitleaks git --pre-commit --staged --redact --no-banner
    - name: taplo
      glob: "*.toml"
      run: taplo fmt --check {staged_files} && taplo lint {staged_files}
    - name: typecheck
      glob: "*.ts"
      run: deno task typecheck
    - name: unit tests
      glob: "*.ts"
      run: deno task test

commit-msg:
  jobs:
    - name: commit message
      run: deno run --allow-read tools/cli/check-commit-message.ts {1}

pre-push:
  jobs:
    - name: full pipeline
      run: deno task ci
