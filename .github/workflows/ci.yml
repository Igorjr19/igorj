name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Sent by the content repository after it changes or refreshes external data.
  repository_dispatch:
    types: [content-updated]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production deployment halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, secrets, audit, types and unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Lets the coverage upload authenticate without a stored token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the secret scan covers every commit.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: deno task lint
      - name: Module metrics and dependency graph
        run: |
          {
            echo '## Module metrics (Ca, Ce, instability)'
            echo '```'
            deno task deps:metrics
            echo '```'
            echo '## Dependency graph'
            echo '```mermaid'
            deno task deps:graph
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: deno task secrets
      - run: deno task audit
      - run: deno task typecheck
      - run: deno task coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: .cache/coverage.lcov
          use_oidc: true

  e2e:
    name: End-to-end tests
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: cache-${{ hashFiles('tests/e2e/support/browser.ts', 'data/themes/*.toml') }}
      - run: deno task test:e2e

  risk:
    name: Risk report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      risky: ${{ steps.report.outputs.risky }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: report
        run: deno task risk "$BASE"
        env:
          BASE: origin/${{ github.base_ref }}

  approval:
    name: Human approval
    needs: risk
    # Runs only for flagged pull requests and waits for a reviewer on the protected environment.
    if: needs.risk.outputs.risky == 'true'
    runs-on: ubuntu-24.04
    environment: review
    steps:
      - run: echo "A reviewer approved this flagged change."

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [quality, e2e]
    # Skipped until the Cloudflare project variable exists, so pushes stay green before deployment is configured.
    if: github.event_name != 'pull_request' && vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: deno task build
        env:
          CONTENT_REPO: ${{ vars.CONTENT_REPO }}
          CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
          ALLOW_EXAMPLE_CONTENT: ${{ vars.ALLOW_EXAMPLE_CONTENT }}
      # The action installs Wrangler with npm, which cannot read the node_modules layout Deno creates.
      - run: rm -rf node_modules
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: '4.149.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }}
