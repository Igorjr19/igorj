name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Sent by the content repository after it changes or refreshes external data.
  repository_dispatch:
    types: [content-updated]
  # Advisories appear without any change here, so they are checked on a schedule instead of failing unrelated pull requests.
  schedule:
    - cron: '17 11 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production deployment halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: cache-${{ hashFiles('frontend/tui/tests/e2e/support/browser.ts', 'frontend/tui/data/themes/*.toml') }}
      - run: deno task app:browsers
      - run: deno task ci

  audit:
    name: Dependency audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: deno task audit

  deploy:
    name: Deploy to Cloudflare Pages
    needs: check
    # Only main is published; a manual run from another branch only checks it.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: deno task build
        env:
          CONTENT_REPO: ${{ vars.CONTENT_REPO }}
          CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
      # The action installs Wrangler with npm, which cannot read the node_modules layout Deno creates.
      - run: rm -rf node_modules
      # The Cloudflare project serves its custom domain from the "production" branch.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: '4.149.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=production
