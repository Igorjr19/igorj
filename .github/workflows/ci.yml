name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Sent by the content repository after it changes or refreshes external data.
  repository_dispatch:
    types: [content-updated]
  # Advisories appear without any change here, so they are checked on a schedule instead of failing unrelated pull requests.
  schedule:
    - cron: '17 11 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production deployment halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: cache-${{ hashFiles('frontend/app/data/themes/*.toml') }}
      # The browsers are the slowest download of the job; the install below only checks them when they are cached.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: browsers-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      # The mirror the runner picks for the packages is slow on some days: about a hundred packages for the three
      # browsers can take far longer than usual. A try that does not finish is cut, and the next one asks another
      # mirror. What is downloaded is kept between tries and between runs, so a slow day costs the download once.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-browsers-1
      - run: |
          mkdir -p "$HOME/apt-archives/partial"
          printf 'Dir::Cache::archives "%s/apt-archives";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\n' "$HOME" | sudo tee /etc/apt/apt.conf.d/99ci
          mirrors=("" "http://archive.ubuntu.com/ubuntu/" "http://azure.archive.ubuntu.com/ubuntu/")
          limits=(240 420 420)
          for attempt in 0 1 2; do
            if [ -n "${mirrors[$attempt]}" ]; then
              echo "${mirrors[$attempt]}" | sudo tee /etc/apt/apt-mirrors.txt
            fi
            timeout --kill-after=10 "${limits[$attempt]}" deno task browsers && { sudo chmod -R a+rX "$HOME/apt-archives"; exit 0; }
            echo "Browsers not installed (try $((attempt + 1)))"
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo dpkg --configure -a || true
          done
          exit 1
      - run: deno task ci

  audit:
    name: Dependency audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: deno task audit

  deploy:
    name: Deploy to Cloudflare Pages
    needs: check
    # Only main is published; a manual run from another branch only checks it.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: deno task build
        env:
          CONTENT_REPO: ${{ vars.CONTENT_REPO }}
          CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
      # The professional edition is made from the same commit and the same content, for a second Pages project. It is
      # published only where that project is named.
      - run: deno task build:pro
        if: vars.CLOUDFLARE_PAGES_PROJECT_PRO != ''
      # The action installs Wrangler with npm, which cannot read the node_modules layout Deno creates.
      - run: rm -rf node_modules
      # The Cloudflare project serves its custom domain from the "production" branch.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: '4.149.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=production
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        if: vars.CLOUDFLARE_PAGES_PROJECT_PRO != ''
        with:
          wranglerVersion: '4.149.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public-pro --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_PRO }} --branch=production
