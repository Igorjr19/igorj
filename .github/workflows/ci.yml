name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      content_ref:
        description: Content branch to build. Any branch other than main deploys a preview named after it, which may hold example content.
        type: string
        default: main
  # Sent by the content repository after it changes or refreshes external data.
  repository_dispatch:
    types: [content-updated]
  # Advisories appear without any change here, so they are checked on a schedule instead of failing unrelated pull requests.
  schedule:
    - cron: '17 11 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production deployment halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: cache-${{ hashFiles('tests/e2e/support/browser.ts', 'data/themes/*.toml') }}
      - run: deno task ci

  audit:
    name: Dependency audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: deno task audit

  deploy:
    name: Deploy to Cloudflare Pages
    needs: check
    # Skipped until the Cloudflare project variable exists, so pushes stay green before deployment is configured.
    if: github.event_name != 'pull_request' && vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == 'main' && (inputs.content_ref || 'main') == 'main' && 'production' || 'preview' }}
    env:
      CONTENT_REF: ${{ inputs.content_ref || 'main' }}
      # The Cloudflare project serves its custom domain from the "production" branch; any other branch is a preview.
      # Building another content branch from main gives a preview named after that branch.
      PAGES_BRANCH: >-
        ${{ github.ref_name == 'main' && (inputs.content_ref || 'main') == 'main' && 'production'
        || (inputs.content_ref || 'main') != 'main' && inputs.content_ref
        || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: deno task build
        env:
          CONTENT_REPO: ${{ vars.CONTENT_REPO }}
          CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
          # Production never publishes example content; previews sit behind a login and may.
          ALLOW_EXAMPLE_CONTENT: ${{ env.PAGES_BRANCH != 'production' && '1' || '' }}
      # The action installs Wrangler with npm, which cannot read the node_modules layout Deno creates.
      - run: rm -rf node_modules
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: '4.149.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ env.PAGES_BRANCH }}
