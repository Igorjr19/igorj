baseURL = "https://igorj.dev/"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

enableRobotsTXT = true

[params]
shell = "igorj"
repository = "https://github.com/Igorjr19/igorj"

[markup.highlight]
# Code colors come from the theme roles instead of inline styles.
noClasses = false

# What the terminal reads, one file per language, fetched only when it opens.
[outputFormats.terminal]
mediaType = "application/json"
baseName = "terminal"
isPlainText = true
notAlternative = true

# Only the home and the categories publish feeds, both with posts only.
[outputs]
home = ["html", "rss", "terminal"]
section = ["html"]
taxonomy = ["html"]
term = ["html", "rss"]

[taxonomies]
category = "categories"

[languages.pt]
locale = "pt-BR"
label = "Português"
weight = 1

[languages.en]
locale = "en"
label = "English"
weight = 2

# Defining any mount replaces Hugo's defaults for that target, so every source is listed.
# tests/fixtures/hugo.toml next to this file mirrors this list with the fixture content.
# Hugo runs from the repository root, so every source is relative to it.
[module]
[[module.mounts]]
source = "frontend/tui/adapters"
target = "content"
[[module.mounts]]
source = "frontend/tui/layouts"
target = "layouts"
[[module.mounts]]
source = "frontend/tui/i18n"
target = "i18n"
[[module.mounts]]
source = "frontend/tui/data"
target = "data"
[[module.mounts]]
source = "frontend/tui/static"
target = "static"
[[module.mounts]]
source = "frontend/tui/pages"
target = "content"
[[module.mounts]]
source = "frontend/tui/assets"
target = "assets"
# Only the icons the site shows; Font Awesome itself is never loaded.
[[module.mounts]]
source = "node_modules/@fortawesome/fontawesome-free/svgs/brands"
target = "assets/icons"
files = ["github.svg", "linkedin.svg", "instagram.svg", "lastfm.svg", "letterboxd.svg"]
# The interface icons the bars use.
[[module.mounts]]
source = "node_modules/@fortawesome/fontawesome-free/svgs/solid"
target = "assets/icons/solid"
files = [
  "envelope.svg",
  "table-columns.svg",
  "terminal.svg",
  "circle-half-stroke.svg",
  "circle-question.svg",
  "rss.svg",
  "list.svg",
  "table-cells-large.svg",
  "filter.svg",
  "magnifying-glass.svg",
]
[[module.mounts]]
source = "generated/css"
target = "assets/css/generated"
[[module.mounts]]
source = "generated/model"
target = "data/model"
[[module.mounts]]
source = "generated/media"
target = "assets/media"
[[module.mounts]]
source = "generated/data"
target = "data/generated"
[[module.mounts]]
source = "generated/static"
target = "static"
