baseURL = "https://igorj.dev/"
title = "Ígor José Rodrigues — Developer"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

enableRobotsTXT = true

[params]
author = "Ígor José Rodrigues"
shell = "igorj"
repository = "https://github.com/Igorjr19/igorj"

[markup.highlight]
# Code colors come from the theme roles instead of inline styles.
noClasses = false

# Only the home and the categories publish feeds, both with posts only.
[outputs]
home = ["html", "rss"]
section = ["html"]
taxonomy = ["html"]
term = ["html", "rss"]

[taxonomies]
category = "categories"

[languages.pt]
locale = "pt-BR"
label = "Português"
weight = 1

[languages.en]
locale = "en"
label = "English"
weight = 2

# Defining any mount replaces Hugo's defaults for that target, so every source is listed.
# tests/fixtures/hugo.toml next to this file mirrors this list with the fixture content.
# Hugo runs from the repository root, so every source is relative to it.
[module]
[[module.mounts]]
source = "content"
target = "content"
files = ["**/*.md", "**/*.png", "**/*.jpg", "**/*.webp", "**/*.svg", "**/*.pdf", "! README.md"]
[[module.mounts]]
source = "content"
target = "data"
files = ["**/*.yaml", "**/*.json"]
[[module.mounts]]
source = "frontend/tui/layouts"
target = "layouts"
[[module.mounts]]
source = "frontend/tui/i18n"
target = "i18n"
[[module.mounts]]
source = "frontend/tui/data"
target = "data"
[[module.mounts]]
source = "frontend/tui/static"
target = "static"
[[module.mounts]]
source = "frontend/tui/pages"
target = "content"
[[module.mounts]]
source = "frontend/tui/assets"
target = "assets"
# The photo is processed at build time, so it reaches the asset pipeline instead of the content.
[[module.mounts]]
source = "content"
target = "assets"
files = ["about/photo.*"]
# Only the brand icons the site links to; Font Awesome itself is never loaded.
[[module.mounts]]
source = "node_modules/@fortawesome/fontawesome-free/svgs/brands"
target = "assets/icons"
files = ["github.svg", "linkedin.svg", "instagram.svg", "lastfm.svg", "letterboxd.svg"]
[[module.mounts]]
source = "generated/css"
target = "assets/css/generated"
[[module.mounts]]
source = "generated/data"
target = "data/generated"
[[module.mounts]]
source = "generated/static"
target = "static"
