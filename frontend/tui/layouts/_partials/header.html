<header class="site-header">
  <div class="site-header__identity">
    {{- if .IsHome }}
    <h1 class="site-header__name">{{ (partial "author.html" .) }}</h1>
    {{- else }}
    <p class="site-header__name"><a href="{{ site.Home.RelPermalink }}">{{ (partial "author.html" .) }}</a></p>
    {{- end }}
    <p class="site-header__role">{{ partial "role.html" . }}<span class="cursor" aria-hidden="true"></span></p>
  </div>
  {{- if ne .Kind "404" }}{{ with .Translations }}
  <nav class="site-header__languages" aria-label="{{ i18n "languages" }}">
    {{- range . }}
    <a href="{{ .RelPermalink }}" hreflang="{{ .Language.Locale }}" lang="{{ .Language.Locale }}">{{ .Language.Label }}</a>
    {{- end }}
  </nav>
  {{- end }}{{ end }}
</header>
