{{- $projects := where (where site.RegularPages "Section" "projects") "Params.featured" true }}
{{- with $projects }}
<ul class="entries">
  {{- range . }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    <span class="panel__meta">{{ delimit .Params.stack " · " }}</span>
  </li>
  {{- end }}
</ul>
{{- else }}
{{ partial "panels/empty.html" . }}
{{- end }}
