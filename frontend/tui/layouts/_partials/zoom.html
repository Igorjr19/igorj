{{- /* An inner page as one article. Expects page and body. */ -}}
{{- $page := .page }}
<article class="zoom{{ if $page.IsPage }} zoom--page{{ end }}" aria-labelledby="page-title">
  <h1 class="zoom__title" id="page-title">{{ partial "page-title.html" $page }}</h1>
  <div class="zoom__body{{ if $page.IsPage }} prose{{ end }}">
    {{ .body }}
  </div>
</article>
