file = "FiraCode-Bold.ttf"
url = "https://raw.githubusercontent.com/tonsky/FiraCode/5.2/distr/ttf/FiraCode-Bold.ttf"
sha256 = "37a609b7e27516ce0cf55cb7550edd1a1cbd8cd5bc028415a1d520c426c10357"

[[fonts]]
file = "FiraCode-Regular.ttf"
