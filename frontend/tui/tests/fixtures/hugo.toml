# Same mounts as hugo.toml, reading the fixture content instead of the private content repository.
[module]
[[module.mounts]]
source = "tests/fixtures/content"
target = "content"
files = ["posts/**", "projects/**", "research/**"]
[[module.mounts]]
source = "tests/fixtures/content"
target = "data"
files = ["about/*.yaml", "contact/*.yaml", "cv/*.yaml", "reading/*.yaml", "external/*.json"]
[[module.mounts]]
source = "frontend/tui/layouts"
target = "layouts"
[[module.mounts]]
source = "frontend/tui/i18n"
target = "i18n"
[[module.mounts]]
source = "frontend/tui/data"
target = "data"
[[module.mounts]]
source = "frontend/tui/static"
target = "static"
[[module.mounts]]
source = "frontend/tui/pages"
target = "content"
[[module.mounts]]
source = "frontend/tui/assets"
target = "assets"
[[module.mounts]]
source = "tests/fixtures/content"
target = "assets"
files = ["about/photo.*"]
# Only the brand icons the site links to; Font Awesome itself is never loaded.
[[module.mounts]]
source = "node_modules/@fortawesome/fontawesome-free/svgs/brands"
target = "assets/icons"
files = ["github.svg", "linkedin.svg", "instagram.svg", "lastfm.svg", "letterboxd.svg"]
[[module.mounts]]
source = "generated/css"
target = "assets/css/generated"
[[module.mounts]]
source = "generated/data"
target = "data/generated"
[[module.mounts]]
source = "generated/static"
target = "static"
