# Services the daily job of the content repository reads. The site shows the saved data and names each source in the
# system box and on the credits page, only when the model has its data. Covers and posters are the one thing the
# visitor's browser loads from the services themselves.
[[sources]]
name = "Last.fm"
homepage = "https://www.last.fm"
model = "music"
what = "sourceMusic"

[[sources]]
name = "Letterboxd"
homepage = "https://letterboxd.com"
model = "films"
what = "sourceFilms"

[[sources]]
name = "GitHub"
homepage = "https://github.com"
model = "github"
what = "sourceGithub"

[[sources]]
name = "CodeTime"
homepage = "https://codetime.dev"
model = "codetime"
what = "sourceCodetime"
